<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>لوحة التقييمات — Domains</title>
  <meta name="theme-color" content="#0616C4">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<!-- تسجيل الدخول -->
<div class="login" id="loginView">
  <div class="card">
    <svg class="mark" viewBox="0 0 166 169" fill="none" stroke-width="27" style="width:54px;height:56px;margin-bottom:18px" aria-hidden="true"><circle cx="83" cy="19" r="69.5"/><circle cx="83" cy="196" r="69.5"/></svg>
    <div><span class="wordmark" aria-label="Domains">D<svg class="o" viewBox="0 0 166 169" fill="none" stroke-width="27" aria-hidden="true"><circle cx="83" cy="19" r="69.5"/><circle cx="83" cy="196" r="69.5"/></svg>mains</span></div>
    <p class="muted" style="margin:6px 0 0">لوحة إدارة التقييمات</p>
    <form id="loginForm">
      <label class="label" for="pw" style="margin:0">كلمة السر</label>
      <input class="field" id="pw" type="password" autocomplete="current-password" required>
      <p class="err" id="loginErr"></p>
      <button class="btn" type="submit">دخول</button>
    </form>
  </div>
</div>

<!-- اللوحة -->
<div class="admin" id="adminView" hidden>
  <header class="admin-top">
    <span class="wordmark" aria-label="Domains">D<svg class="o" viewBox="0 0 166 169" fill="none" stroke-width="27" aria-hidden="true"><circle cx="83" cy="19" r="69.5"/><circle cx="83" cy="196" r="69.5"/></svg>mains</span>
    <span class="title">لوحة التقييمات</span>
    <span class="badge" id="modeBadge" hidden>وضع تجريبي</span>
    <span class="spacer"></span>
    <button class="btn ghost small" id="refreshBtn" type="button">تحديث</button>
    <button class="btn small" id="csvBtn" type="button">تصدير Excel</button>
    <button class="btn ghost small" id="logoutBtn" type="button">خروج</button>
  </header>

  <div class="filters">
    <div class="seg" id="rangeSeg" role="group" aria-label="الفترة">
      <button type="button" data-range="7">٧ أيام</button>
      <button type="button" data-range="30" aria-pressed="true">٣٠ يوماً</button>
      <button type="button" data-range="90">٣ أشهر</button>
      <button type="button" data-range="0">الكل</button>
    </div>
    <select class="field" id="visitFilter" aria-label="سبب الزيارة"><option value="">كل الزيارات</option></select>
    <span class="spacer" style="flex:1"></span>
    <span id="demoTools" style="display:none;gap:8px">
      <button class="btn ghost small" id="seedBtn" type="button">توليد بيانات تجريبية</button>
      <button class="btn ghost small" id="clearBtn" type="button">مسح</button>
    </span>
  </div>

  <div id="dash"></div>
</div>

<div class="tip" id="tip" role="tooltip"></div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/categories.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
