<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>لوحة التقييمات — Domains</title>
  <meta name="theme-color" content="#1D3A89">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<!-- تسجيل الدخول -->
<div class="login" id="loginView">
  <div class="card box">
    <div class="box-head"><span class="wordmark" aria-label="Domains">D<svg class="o" viewBox="0 0 166 169" fill="none" stroke-width="27" aria-hidden="true"><circle cx="83" cy="19" r="69.5"/><circle cx="83" cy="196" r="69.5"/></svg>mains</span><p>لوحة إدارة التقييمات</p></div>
    <form id="loginForm">
      <label class="label" for="pw" style="margin:0">كلمة السر</label>
      <input class="field" id="pw" type="password" autocomplete="current-password" required>
      <p class="err" id="loginErr"></p>
      <button class="btn" type="submit">دخول</button>
    </form>
  </div>
</div>

<!-- اللوحة -->
<div class="shell" id="adminView" hidden>
  <aside class="sidebar">
    <div class="brand"><span class="wordmark" aria-label="Domains">D<svg class="o" viewBox="0 0 166 169" fill="none" stroke-width="27" aria-hidden="true"><circle cx="83" cy="19" r="69.5"/><circle cx="83" cy="196" r="69.5"/></svg>mains</span><small>لوحة إدارة التقييمات</small></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="أقسام اللوحة">
      <button type="button" role="tab" data-tab="overview" aria-selected="true"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>نظرة عامة</button>
      <button type="button" role="tab" data-tab="cats" aria-selected="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>التصنيفات</button>
      <button type="button" role="tab" data-tab="tracks" aria-selected="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg>المسارات</button>
      <button type="button" role="tab" data-tab="voice" aria-selected="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/></svg>صوت الطلاب<b id="newCount" hidden></b></button>
      <button type="button" role="tab" data-tab="reports" aria-selected="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>تقارير</button>
    </nav>
    <div class="side-foot">
      <button class="btn on-grad small" id="logoutBtn" type="button">خروج</button>
    </div>
  </aside>

  <div class="main">
    <header class="a-head">
      <div class="row">
        <h1 id="pageTitle">نظرة عامة</h1>
        <span class="badge mode-badge" id="modeBadge" hidden>وضع تجريبي</span>
        <span class="live" id="live"><i></i><span id="liveText">مباشر</span></span>
        <span class="spacer"></span>
        <span class="actions">
          <span id="demoTools" style="display:none;gap:8px">
            <button class="btn on-grad small" id="seedBtn" type="button">بيانات تجريبية</button>
            <button class="btn on-grad small" id="clearBtn" type="button">مسح</button>
          </span>
          <button class="btn on-grad small" id="refreshBtn" type="button">تحديث</button>
          <button class="btn on-grad solid small" id="csvBtn" type="button">تصدير Excel</button>
        </span>
      </div>
    </header>
    <div class="toolbar">
      <div class="seg" id="rangeSeg" role="group" aria-label="الفترة">
        <button type="button" data-range="7">٧ أيام</button>
        <button type="button" data-range="30" aria-pressed="true">٣٠ يوماً</button>
        <button type="button" data-range="90">٣ أشهر</button>
        <button type="button" data-range="0">الكل</button>
        <button type="button" data-range="custom">مخصص</button>
      </div>
      <span class="custom-range" id="customRange" hidden>
        <label for="fromDate">من</label><input class="field" type="date" id="fromDate">
        <label for="toDate">إلى</label><input class="field" type="date" id="toDate">
      </span>
      <select class="field" id="visitFilter" aria-label="سبب الزيارة"><option value="">كل الزيارات</option></select>
    </div>
    <main class="admin" id="dash"></main>
  </div>
</div>

<div class="tip" id="tip" role="tooltip"></div>
<div class="drawer-back" id="drawerBack" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/categories.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
